[package]
name = "service-notif"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
apalis = { version = "0.6", features = ["retry"] }
apalis-cron = { version = "0.6" }
apalis-sql = { version = "0.6", features = ["postgres"] }
base64 = "0.22.1"
chrono = { version = "0.4.32", features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
maud = "*"
reqwest = { version = "0.12", features = ["json", "cookies"] }
serde = { version = "1.0.219", features = [ "derive" ] }
serde_json = "1.0.140"
shuttle-runtime = "0.54.0"
shuttle-shared-db = { version = "0.54.0", features = ["postgres"] }
sqlx = { version = "0.8", features = ["runtime-tokio-native-tls", "postgres"] }
tokio = { version = "1", features = ["full"] }
